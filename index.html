<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kehadiran Pelajar</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066FF;
            --primary-dark: #0052CC;
            --secondary: #00D9FF;
            --success: #00C853;
            --warning: #FFB300;
            --danger: #FF3D00;
            --dark: #1A1A2E;
            --dark-secondary: #16213E;
            --text: #E8E8E8;
            --text-secondary: #A0A0A0;
            --border: #2D3748;
            --bg-card: #252A3F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: var(--text);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 40px 0;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 3em;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1em;
            font-weight: 500;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 102, 255, 0.2);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--dark-secondary);
            color: var(--text);
            font-size: 1em;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 102, 255, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #00E676);
            color: white;
            box-shadow: 0 10px 30px rgba(0, 200, 83, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 200, 83, 0.4);
        }

        .btn-secondary {
            background: var(--dark-secondary);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            transform: translateY(-3px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #FF6E40);
            color: white;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .info-item {
            background: var(--dark-secondary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .info-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--text);
            font-family: 'Space Mono', monospace;
        }

        .camera-container {
            margin: 30px 0;
            text-align: center;
        }

        #video, #canvas {
            max-width: 100%;
            border-radius: 12px;
            border: 3px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        #canvas {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 600;
            animation: slideInRight 0.5s ease;
        }

        .alert-success {
            background: rgba(0, 200, 83, 0.2);
            border: 2px solid var(--success);
            color: var(--success);
        }

        .alert-danger {
            background: rgba(255, 61, 0, 0.2);
            border: 2px solid var(--danger);
            color: var(--danger);
        }

        .alert-warning {
            background: rgba(255, 179, 0, 0.2);
            border: 2px solid var(--warning);
            color: var(--warning);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            background: var(--dark-secondary);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(0, 102, 255, 0.1);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        .filter-section {
            background: var(--dark-secondary);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-hadir {
            background: rgba(0, 200, 83, 0.2);
            color: var(--success);
        }

        .status-tidak-hadir {
            background: rgba(255, 61, 0, 0.2);
            color: var(--danger);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .card {
                padding: 25px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 10px;
            }
        }

        .image-preview {
            margin: 20px 0;
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            border: 3px solid var(--success);
            box-shadow: 0 10px 40px rgba(0, 200, 83, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Sistem Kehadiran Pelajar</h1>
            <p>Sistem Pengurusan Kehadiran Pelajar</p>
        </div>

        <!-- Screen 1: Masukkan Kod -->
        <div id="screen1" class="screen active">
            <div class="card">
                <h2 style="margin-bottom: 30px; font-size: 2em;">Masukkan Kod Pelajar</h2>
                <div class="form-group">
                    <label for="kodInput">Kod Pelajar</label>
                    <input type="text" id="kodInput" placeholder="Masukkan kod pelajar anda" onkeypress="if(event.key === 'Enter') cariPelajar()" />
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="cariPelajar()">
                        <span>Masuk</span>
                    </button>
                    <button class="btn btn-secondary" onclick="alert('Butang berfungsi! Kod: ' + document.getElementById('kodInput').value)" style="display:none;" id="testBtn">
                        <span>Test</span>
                    </button>
                </div>
                <div id="alertScreen1"></div>
            </div>
        </div>

        <!-- Screen 2: Paparan Maklumat & Selfie -->
        <div id="screen2" class="screen">
            <div class="card">
                <h2 style="margin-bottom: 30px; font-size: 2em;">Rekod Kehadiran</h2>
                
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Nama Pelajar</div>
                        <div class="info-value" id="namaPelajar">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">ID Pelajar</div>
                        <div class="info-value" id="idPelajar">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Kelas</div>
                        <div class="info-value" id="kelas">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Tarikh</div>
                        <div class="info-value" id="tarikh">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Masa</div>
                        <div class="info-value" id="masa">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Lokasi GPS</div>
                        <div class="info-value" id="lokasi" style="font-size: 0.9em; word-break: break-all;">-</div>
                    </div>
                </div>

                <div class="camera-container">
                    <h3 style="margin-bottom: 20px;">Ambil Gambar Selfie (Pilihan)</h3>
                    <video id="video" width="400" height="300" autoplay></video>
                    <canvas id="canvas" width="400" height="300"></canvas>
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="bukaKamera()">
                        <span>📷 Buka Kamera</span>
                    </button>
                    <button class="btn btn-secondary" onclick="ambilGambar()" id="btnAmbilGambar" style="display: none;">
                        <span>📸 Ambil Gambar</span>
                    </button>
                    <button class="btn btn-success" onclick="simpanKehadiran()">
                        <span>💾 Simpan Kehadiran</span>
                    </button>
                    <button class="btn btn-secondary" onclick="kembaliScreen1()">
                        <span>← Kembali</span>
                    </button>
                </div>

                <div id="alertScreen2"></div>
            </div>
        </div>

        <!-- Navigation untuk akses pensyarah - REMOVED -->
    </div>

    <!-- Footer Disclaimer -->
    <div style="text-align: center; padding: 30px 20px; color: #94A3B8; font-size: 0.9em;">
        <p style="margin: 0;">
            Sistem ini dibangunkan oleh <strong style="color: #F1F5F9;">Wan Fazlini Idayu</strong> dengan bantuan AI
        </p>
        <p style="margin: 5px 0 0 0; font-size: 0.85em; opacity: 0.7;">
            © 2026 Sistem Kehadiran Pelajar
        </p>
    </div>

    <script>
        // Error handler untuk debug
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Global error:', msg, 'at line', lineNo);
            alert('Error: ' + msg + ' at line ' + lineNo);
            return false;
        };

        // Konfigurasi
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtJhwz-IfkRXqLDLlWWoGBphXmgneyZAiS0hJzqii-hoQjXCXJGMR6QhJRh9cCOPJHiw/exec';
        
        let currentPelajar = null;
        let videoStream = null;
        let capturedImageData = null;
        let lokasiGPS = ''; // Variable untuk simpan URL GPS

        // Fungsi untuk tukar screen
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Screen 1: Cari pelajar berdasarkan kod
        async function cariPelajar() {
            console.log('Fungsi cariPelajar dipanggil');
            const kod = document.getElementById('kodInput').value.trim();
            const alertDiv = document.getElementById('alertScreen1');
            
            console.log('Kod yang dimasukkan:', kod);
            
            if (!kod) {
                alertDiv.innerHTML = '<div class="alert alert-warning">Sila masukkan kod pelajar!</div>';
                return;
            }

            alertDiv.innerHTML = '<div class="alert alert-warning"><span class="loading"></span> Mencari data pelajar...</div>';

            try {
                const url = `${SCRIPT_URL}?action=search&sheet=sheet1&value=${encodeURIComponent(kod)}`;
                console.log('Fetching URL:', url);
                
                const response = await fetch(url);
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Data received:', data);

                if (data && data.length > 0 && data[0].length > 0) {
                    currentPelajar = {
                        kod: data[0][0],
                        id: data[0][1],
                        nama: data[0][2],
                        kelas: data[0][3]
                    };

                    console.log('Current pelajar:', currentPelajar);

                    // Dapatkan lokasi GPS
                    getLocation();
                    
                    // Papar maklumat di screen 2
                    paparMaklumatPelajar();
                    showScreen('screen2');
                } else {
                    console.log('Data tidak dijumpai');
                    alertDiv.innerHTML = '<div class="alert alert-danger">❌ Kod pelajar tidak dijumpai!</div>';
                }
            } catch (error) {
                console.error('Error details:', error);
                alertDiv.innerHTML = '<div class="alert alert-danger">❌ Ralat sambungan: ' + error.message + '</div>';
            }
        }

        // Papar maklumat pelajar di screen 2
        function paparMaklumatPelajar() {
            const now = new Date();
            const tarikh = formatTarikh(now);
            const masa = formatMasa(now);

            document.getElementById('namaPelajar').textContent = currentPelajar.nama;
            document.getElementById('idPelajar').textContent = currentPelajar.id;
            document.getElementById('kelas').textContent = currentPelajar.kelas;
            document.getElementById('tarikh').textContent = tarikh;
            document.getElementById('masa').textContent = masa;
        }

        // Dapatkan lokasi GPS
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        lokasiGPS = `http://maps.google.com/?q=${lat},${lng}`;
                        document.getElementById('lokasi').innerHTML = 
                            `<a href="${lokasiGPS}" target="_blank" style="color: var(--secondary);">${lat.toFixed(6)}, ${lng.toFixed(6)}</a>`;
                    },
                    (error) => {
                        console.error('Error getting location:', error);
                        lokasiGPS = '';
                        document.getElementById('lokasi').textContent = 'Lokasi tidak tersedia';
                    }
                );
            } else {
                lokasiGPS = '';
                document.getElementById('lokasi').textContent = 'GPS tidak disokong';
            }
        }

        // Buka kamera
        async function bukaKamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                const video = document.getElementById('video');
                video.srcObject = videoStream;
                video.style.display = 'block';
                document.getElementById('canvas').style.display = 'none';
                document.getElementById('btnAmbilGambar').style.display = 'inline-block';
                document.getElementById('imagePreview').innerHTML = '';
            } catch (error) {
                console.error('Error accessing camera:', error);
                alert('Tidak dapat mengakses kamera. Sila benarkan akses kamera.');
            }
        }

        // Ambil gambar selfie
        function ambilGambar() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Simpan sebagai base64
            capturedImageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            // Papar preview
            document.getElementById('imagePreview').innerHTML = 
                `<img src="data:image/jpeg;base64,${capturedImageData}" alt="Selfie Preview" />`;

            // Tutup kamera
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            video.style.display = 'none';
            document.getElementById('btnAmbilGambar').style.display = 'none';
        }

        // Simpan kehadiran
        async function simpanKehadiran() {
            const alertDiv = document.getElementById('alertScreen2');
            alertDiv.innerHTML = '<div class="alert alert-warning"><span class="loading"></span> Menyimpan data kehadiran...</div>';

            const now = new Date();
            // Format: DD/MM/YYYY untuk paparan di sheet
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const tarikh = `${day}/${month}/${year}`;
            
            // Format: HH:mm:ss untuk masa
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const masa = `${hours}:${minutes}:${seconds}`;
            
            // Gunakan lokasiGPS global variable yang sudah diset oleh getLocation()
            const lokasi = lokasiGPS || '';

            let pautanGambar = '';

            // Upload gambar jika ada
            if (capturedImageData) {
                // Nama fail format: ID_ddMMyyyy.jpg
                const namaFail = `${currentPelajar.id}_${day}${month}${year}.jpg`;
                
                try {
                    const uploadResponse = await fetch(`${SCRIPT_URL}?action=uploadImage&fileName=${namaFail}&mimeType=image/jpeg`, {
                        method: 'POST',
                        body: capturedImageData
                    });
                    pautanGambar = await uploadResponse.text();
                } catch (error) {
                    console.error('Error uploading image:', error);
                }
            }

            // Simpan data kehadiran
            const rowData = [
                currentPelajar.kod,
                currentPelajar.id,
                currentPelajar.nama,
                currentPelajar.kelas,
                tarikh,
                masa,
                lokasi,
                pautanGambar
            ].join('|');

            try {
                const response = await fetch(`${SCRIPT_URL}?action=write&sheet=sheet2`, {
                    method: 'POST',
                    body: rowData
                });
                const result = await response.text();

                if (result.includes('Berjaya')) {
                    alertDiv.innerHTML = '<div class="alert alert-success">✅ Kehadiran berjaya disimpan!</div>';
                    setTimeout(() => {
                        kembaliScreen1();
                    }, 2000);
                } else {
                    alertDiv.innerHTML = '<div class="alert alert-danger">❌ Ralat menyimpan data. Sila cuba lagi.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                alertDiv.innerHTML = '<div class="alert alert-danger">❌ Ralat sambungan. Sila cuba lagi.</div>';
            }
        }

        // Kembali ke screen 1
        function kembaliScreen1() {
            showScreen('screen1');
            document.getElementById('kodInput').value = '';
            document.getElementById('alertScreen1').innerHTML = '';
            document.getElementById('alertScreen2').innerHTML = '';
            document.getElementById('imagePreview').innerHTML = '';
            capturedImageData = null;
            currentPelajar = null;
            lokasiGPS = '';
            
            // Tutup kamera jika masih aktif
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
        }

        // Fungsi helper untuk format tarikh (Paparan: DD/MM/YYYY)
        function formatTarikh(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Fungsi helper untuk format masa (Paparan: HH:mm:ss)
        function formatMasa(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }
    </script>
</body>
